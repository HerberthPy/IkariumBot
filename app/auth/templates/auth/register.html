<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ikarium Bot</title>
    <link rel="stylesheet" href="{{ url_for('auth.static', filename='auth/style.css') }}">
</head>
<body>

    <div class="register-container">
        <h2>Criar Conta</h2>

        <!-- Exibição de mensagens flash (erros ou avisos) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Sua senha">
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <p>Já tem uma conta? <a href="{{ url_for('auth.login') }}">Fazer Login</a></p>
    </div>

</body>
</html>
