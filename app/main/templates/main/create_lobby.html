{% extends "base.html" %}

{% block title %}Cadastrar Looby - IkariumBot{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('main.static', filename='main/style.css') }}">
{% endblock %}

{% block content %}
    <div class="container mt-4 mb-5" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="mb-0 fs-5">Cadastrar Novo Lobby (Ikariam)</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('main.create_lobby') }}" method="POST">

                    <!-- Dados do Lobby (Ikariam) -->
                    <h5 class="text-primary mb-3 border-bottom pb-2 fs-6 fw-bold">Credenciais do Lobby</h5>

                    <div class="mb-3">
                        <label for="email-lobby" class="form-label">E-mail do Lobby</label>
                        <input type="email" class="form-control" id="email-lobby" name="email-lobby" required placeholder="exemplo@email.com">
                    </div>

                    <div class="row">
                        <!-- SENHA DO LOBBY COM BOTÃO OLHO -->
                        <div class="col-md-6 mb-3">
                            <label for="lobby_password" class="form-label">Senha do Lobby</label>
                            <div class="input-group">
                                <input type="password" class="form-control password-input" id="lobby_password" name="lobby_password" required placeholder="••••••••">
                                <button class="btn btn-outline-secondary toggle-pass-btn" type="button" onclick="toggleInputPassword(this)" title="Exibir/Ocultar Senha">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nickname" class="form-label">Apelido Lobby</label>
                            <input type="text" class="form-control" id="nickname" name="nickname" placeholder="Ex: Doadora / Produtora ...">
                        </div>
                    </div>

                    <!-- Configurações da VPN -->
                    <h5 class="text-primary mt-4 mb-3 border-bottom pb-2 fs-6 fw-bold">Configurações da VPN</h5>

                    <div class="row">
                        <!-- Email da VPN -->
                        <div class="col-md-6 mb-3">
                            <label for="vpn_email" class="form-label">Email da VPN</label>
                            <input type="email" class="form-control" id="vpn_email" name="vpn_email" required placeholder="vpn_email@exemplo.com">
                        </div>

                        <!-- Senha da VPN -->
                        <div class="col-md-6 mb-3">
                            <label for="vpn_password" class="form-label">Senha VPN</label>
                            <div class="input-group">
                                <input type="password" class="form-control password-input" id="vpn_password" name="vpn_password" required placeholder="••••••••">
                                <button class="btn btn-outline-secondary toggle-pass-btn" type="button" onclick="toggleInputPassword(this)" title="Exibir/Ocultar Senha">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- País do Lobby (Select) -->
                        <div class="col-md-12 mb-3">
                            <label for="country" class="form-label">País do Lobby</label>
                            <select class="form-select" id="country" name="country" required>
                                <option value="" selected disabled>Selecione um país...</option>
                                <option value="BR">Brasil (BR)</option>
                                <option value="ARG">Argentina (ARG)</option>
                                <option value="ES">Espanha (ES)</option>
                                <option value="US">Estados Unidos (US)</option>
                                <option value="PT">Portugal (PT)</option>
                                <option value="MX">México (MX)</option>
                                <option value="DE">Alemanha (DE)</option>
                                <option value="FR">França (FR)</option>
                                <option value="IT">Itália (IT)</option>
                                <option value="UK">Reino Unido (UK)</option>
                                <option value="EN">Internacional (EN)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Botões de Ação -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('main.list_lobbies') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Salvar Lobby</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}

<script>
const svgEyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/></svg>`;

const svgEyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.536 3.536 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/><path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.12 11.332 5.88 12.5 8 12.5c.97 0 1.884-.242 2.704-.666l.783.784A7.95 7.95 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.709.708zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"/></svg>`;

function toggleInputPassword(button) {
    // Busca o input dentro do mesmo input-group do botão clicado
    const input = button.parentElement.querySelector('.password-input');

    if (input.type === 'password') {
        input.type = 'text';
        button.innerHTML = svgEyeClosed;
    } else {
        input.type = 'password';
        button.innerHTML = svgEyeOpen;
    }
}
</script>

{% endblock %}
