{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <!-- Cabeçalho com botão de retorno -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Cadastrar Nova VPN</h2>
            <p class="text-muted mb-0">Preencha as informações da nova conexão VPN para adicionar ao sistema.</p>
        </div>
        <a href="{{ url_for('main.vpn_list') }}" class="btn btn-outline-secondary rounded-pill px-3">
            &larr; Voltar às VPNs
        </a>
    </div>

    <!-- Card do Formulário -->
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <form action="{{ url_for('main.create_vpn') }}" method="POST">
                
                <div class="row g-3">
                    <!-- nickname -->
                    <div class="col-md-6">
                        <label for="nickname" class="form-label fw-semibold">Apelido da VPN</label>
                        <input type="text" class="form-control" id="nickname" name="nickname" placeholder="Ex: Principal Premium" required>
                    </div>

                    <!-- E-mail -->
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">E-mail da VPN</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="seu-email@exemplo.com" required>
                    </div>

                    <!-- Password -->
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">Senha da VPN</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" onclick="togglePassword()">
                                <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Capacity -->
                    <div class="col-md-3">
                        <label for="capacity" class="form-label fw-semibold">Capacidade Máxima</label>
                        <input type="number" class="form-control" id="capacity" name="capacity" value="10" max="10" min="1" required>
                    </div>

                    <!-- Status -->
                    <div class="col-md-3">
                        <label for="status" class="form-label fw-semibold">Status Inicial</label>
                        <select class="form-select" id="status" name="status">
                            <option value="ATIVA" selected>Ativa</option>
                            <option value="INATIVA">Inativa</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4 text-muted opacity-25">

                <!-- Ações -->
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('main.vpn_list') }}" class="btn btn-light rounded-pill px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold" style="background-color: #4f46e5; border: none;">
                        Salvar VPN
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}

<!-- JavaScript para Alternar Visibilidade da Senha (Olho) -->
<script>
function togglePassword() {
    const inputPassword = document.getElementById('password');
    const iconPassword = document.getElementById('togglePasswordIcon');

    if (inputPassword.type === 'password') {
        inputPassword.type = 'text';
        iconPassword.classList.remove('bi-eye-slash');
        iconPassword.classList.add('bi-eye');
    } else {
        inputPassword.type = 'password';
        iconPassword.classList.remove('bi-eye');
        iconPassword.classList.add('bi-eye-slash');
    }
}
</script>

{% endblock %}
